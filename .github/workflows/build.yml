name: build

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the empty fixture edition
        run: python3 scripts/build-edition.py --edition tests/fixture-edition
      - name: Check version stamp and languages
        run: python3 scripts/check-build.py tests/fixture-edition/site

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the empty fixture edition
        shell: pwsh
        run: ./scripts/build-edition.ps1 -EditionRoot tests/fixture-edition -OutputName site-ps
      - name: Check version stamp and languages
        run: python scripts/check-build.py tests/fixture-edition/site-ps
